<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Diagnostic Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .panel {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        .button {
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button.secondary {
            background-color: #2196F3;
        }
        .button.secondary:hover {
            background-color: #0b7dda;
        }
        .button.danger {
            background-color: #f44336;
        }
        .button.danger:hover {
            background-color: #d32f2f;
        }
        .endpoint-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .response {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            white-space: pre-wrap;
            max-height: 400px;
            overflow: auto;
        }
        .error {
            color: #f44336;
        }
        .success {
            color: #4CAF50;
        }
        .info {
            color: #2196F3;
        }
        .tabs {
            display: flex;
            margin-bottom: 10px;
        }
        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border: 1px solid #ddd;
            background-color: #f1f1f1;
            margin-right: 5px;
        }
        .tab.active {
            background-color: #4CAF50;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .status-online {
            background-color: #4CAF50;
        }
        .status-offline {
            background-color: #f44336;
        }
        .status-unknown {
            background-color: #FFC107;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>API Diagnostic Tool</h1>
        <div>
            <span class="status-indicator" id="serverStatus"></span>
            <span id="serverStatusText">Checking server status...</span>
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <h2>Test Endpoints</h2>
            <input type="text" id="endpoint" class="endpoint-input" placeholder="Enter endpoint (e.g., /api/roles)" value="/api/roles">
            <div>
                <button class="button" onclick="testEndpoint('GET')">GET</button>
                <button class="button secondary" onclick="testEndpoint('POST')">POST</button>
                <button class="button secondary" onclick="testEndpoint('PUT')">PUT</button>
                <button class="button danger" onclick="testEndpoint('DELETE')">DELETE</button>
            </div>
            <div class="tabs">
                <div class="tab active" onclick="showTab('response')">Response</div>
                <div class="tab" onclick="showTab('headers')">Headers</div>
                <div class="tab" onclick="showTab('request')">Request</div>
            </div>
            <div id="responseTab" class="tab-content active">
                <div id="response" class="response">No response yet</div>
            </div>
            <div id="headersTab" class="tab-content">
                <div id="headers" class="response">No headers yet</div>
            </div>
            <div id="requestTab" class="tab-content">
                <div id="request" class="response">No request details yet</div>
            </div>
        </div>

        <div class="panel">
            <h2>Common Endpoints</h2>
            <div>
                <button class="button" onclick="setEndpoint('/api/roles')">Roles</button>
                <button class="button" onclick="setEndpoint('/api/employees')">Employees</button>
                <button class="button" onclick="setEndpoint('/api/companies')">Companies</button>
                <button class="button" onclick="setEndpoint('/api/clients')">Clients</button>
                <button class="button" onclick="setEndpoint('/api/vehicles')">Vehicles</button>
                <button class="button" onclick="setEndpoint('/api/contracts')">Contracts</button>
                <button class="button" onclick="setEndpoint('/api/insurance')">Insurance</button>
                <button class="button" onclick="setEndpoint('/api/maintenance')">Maintenance</button>
                <button class="button" onclick="setEndpoint('/api/permit')">Permits</button>
                <button class="button" onclick="setEndpoint('/api/tariff')">Tariffs</button>
            </div>
            <h3>Server Configuration</h3>
            <div>
                <label>API Base URL:</label>
                <input type="text" id="baseUrl" class="endpoint-input" value="http://localhost:8385">
                <button class="button" onclick="updateBaseUrl()">Update</button>
            </div>
            <div>
                <label>Credentials:</label>
                <select id="credentials" class="endpoint-input">
                    <option value="include">Include</option>
                    <option value="same-origin">Same Origin</option>
                    <option value="omit">Omit</option>
                </select>
            </div>
            <div>
                <label>Mode:</label>
                <select id="mode" class="endpoint-input">
                    <option value="cors">CORS</option>
                    <option value="no-cors">No CORS</option>
                    <option value="same-origin">Same Origin</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8385';
        let currentEndpoint = '/api/roles';

        // Check server status
        async function checkServerStatus() {
            const statusIndicator = document.getElementById('serverStatus');
            const statusText = document.getElementById('serverStatusText');

            statusIndicator.className = 'status-indicator status-unknown';
            statusText.textContent = 'Checking server status...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/health`, {
                    method: 'GET',
                    mode: 'cors'
                });

                if (response.ok) {
                    statusIndicator.className = 'status-indicator status-online';
                    statusText.textContent = 'Server is online';
                } else {
                    statusIndicator.className = 'status-indicator status-offline';
                    statusText.textContent = `Server returned ${response.status}`;
                }
            } catch (error) {
                statusIndicator.className = 'status-indicator status-offline';
                statusText.textContent = 'Server is offline or unreachable';
                console.error('Server status check failed:', error);
            }
        }

        // Update base URL
        function updateBaseUrl() {
            const baseUrlInput = document.getElementById('baseUrl');
            API_BASE_URL = baseUrlInput.value;
            console.log('Updated API base URL:', API_BASE_URL);
        }

        // Set endpoint
        function setEndpoint(endpoint) {
            document.getElementById('endpoint').value = endpoint;
            currentEndpoint = endpoint;
        }

        // Show tab
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Deactivate all tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(`${tabName}Tab`).classList.add('active');

            // Activate selected tab button
            document.querySelector(`.tab[onclick="showTab('${tabName}')"]`).classList.add('active');
        }

        // Test endpoint
        async function testEndpoint(method) {
            const endpointInput = document.getElementById('endpoint');
            const endpoint = endpointInput.value;
            const responseDiv = document.getElementById('response');
            const headersDiv = document.getElementById('headers');
            const requestDiv = document.getElementById('request');

            const credentials = document.getElementById('credentials').value;
            const mode = document.getElementById('mode').value;

            responseDiv.textContent = 'Loading...';
            headersDiv.textContent = 'Loading...';
            requestDiv.textContent = 'Loading...';

            const url = `${API_BASE_URL}${endpoint}`;

            // Log request details
            const requestDetails = {
                url,
                method,
                credentials,
                mode,
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                }
            };

            requestDiv.textContent = JSON.stringify(requestDetails, null, 2);

            try {
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials,
                    mode
                };

                // Add body for POST and PUT requests
                if (method === 'POST' || method === 'PUT') {
                    options.body = JSON.stringify({ test: true });
                }

                const response = await fetch(url, options);

                // Log response headers
                const headers = {};
                response.headers.forEach((value, key) => {
                    headers[key] = value;
                });
                headersDiv.textContent = JSON.stringify(headers, null, 2);

                // Try to parse response as JSON
                try {
                    const data = await response.json();
                    responseDiv.textContent = JSON.stringify(data, null, 2);
                    responseDiv.className = 'response success';
                } catch (e) {
                    // If not JSON, get text
                    const text = await response.text();
                    responseDiv.textContent = text;
                    responseDiv.className = 'response info';
                }

                // Add status code to response
                responseDiv.textContent = `Status: ${response.status} ${response.statusText}\n\n${responseDiv.textContent}`;

                if (!response.ok) {
                    responseDiv.className = 'response error';
                }
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
                responseDiv.className = 'response error';
                console.error('API test error:', error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkServerStatus();
        });
    </script>
</body>
</html>
